[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mybk-planner"
version = "1.0.0"
description = "Read-only CLI + library for the HCMUT myBK portal: transcript, GPA, curriculum (CTĐT), timetable, exam schedule, and a next-semester course planner with tuition estimates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nguyễn Thành Danh", email = "tdanh2005@gmail.com" },
]
keywords = [
    "hcmut", "mybk", "vietnam", "student", "planner", "course-planner",
    "gpa", "transcript", "timetable", "exam-schedule", "curriculum",
    "ctdt", "cli", "read-only", "cas-sso",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/danhnth/mybk-planner"
Repository = "https://github.com/danhnth/mybk-planner"
Issues = "https://github.com/danhnth/mybk-planner/issues"
Documentation = "https://github.com/danhnth/mybk-planner#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
mybk-planner = "mybk_planner.cli:main"

[tool.setuptools]
packages = ["mybk_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
